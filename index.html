        body, html {

            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            user-select: none;

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            outline: none;

        /* Glassmorphic Material Surface */

            background: rgba(13, 17, 28, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
        }

        /* Material Ripple / Glow Action Button */
        .magic-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .magic-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.22);
            border-color: rgba(147, 197, 253, 0.35);
        }
        .magic-btn:active {
            transform: translateY(0);
        }

        /* Custom Scrollbar for Move History */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
    </style>
</head>

    <script>
        // Web Audio API Synthesizer (No external dependencies, works offline)
        class WizardSoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggle() {
                this.enabled = !this.enabled;
                return this.enabled;
            }

            playHover() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(420, now);
                osc.frequency.exponentialRampToValueAtTime(680, now + 0.08);
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }

            playMove() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(90, now + 0.22);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            }

            playCastSpell() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1400, now + 0.25);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.28);
            }

            playShatter() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                // White noise burst for debris crumble
                const bufferSize = this.ctx.sampleRate * 0.35;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1200, now);
                filter.frequency.exponentialRampToValueAtTime(200, now + 0.35);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
                noise.stop(now + 0.35);
            }

            playCheck() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.setValueAtTime(1174.66, now + 0.12);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        const soundFX = new WizardSoundFX();
    </script>

    <script>
        let scene, camera, renderer, controls;
        let chess = new Chess();
        const piecesMap = new Map(); // square -> THREE.Group
        const boardTiles = []; // 64 square meshes
        const activeIndicators = []; // Move highlight meshes
        const particleSystems = []; // Animation loops for magic & shattered shards

        // Selected square state
        let selectedSquare = null;
        let validMoveSquares = [];
        let isAnimating = false;
        let aiDifficulty = 'archmage'; // 'novice', 'apprentice', 'archmage'
        let cameraModeIndex = 0;

        const SQUARE_SIZE = 1.6;
        const BOARD_OFFSET = (7 * SQUARE_SIZE) / 2;

        const pieceSymbols = {
            p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚'
        };

        const pieceValues = {

    <script>
        function initScene() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060913);
            scene.fog = new THREE.FogExp2(0x060913, 0.024);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 14, 15);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Do not go below cathedral floor
            controls.minDistance = 6;
            controls.maxDistance = 32;
            controls.target.set(0, 0, 0);

            buildCathedralEnvironment();
            setupLighting();
            initMaterials();
            buildChessBoard();
            spawnInitialPieces();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown);
        }

        function setupLighting() {
            // Ambient cathedral light
            const ambient = new THREE.AmbientLight(0x1e293b, 0.8);
            scene.add(ambient);

            // Main overhead moonlight spot
            const moonSpot = new THREE.SpotLight(0xcfd8dc, 3.2, 45, Math.PI / 4, 0.4, 1.2);
            moonSpot.position.set(6, 22, 10);
            moonSpot.castShadow = true;
            moonSpot.shadow.mapSize.width = 2048;
            moonSpot.shadow.mapSize.height = 2048;
            moonSpot.shadow.camera.near = 5;
            moonSpot.shadow.camera.far = 40;
            moonSpot.shadow.bias = -0.0005;
            scene.add(moonSpot);

            // Cathedral warm candlelight accents
            const candleWarm1 = new THREE.PointLight(0xf59e0b, 1.5, 20);
            candleWarm1.position.set(-8, 3.5, -8);
            scene.add(candleWarm1);

            const candleWarm2 = new THREE.PointLight(0x0284c7, 1.4, 20);
            candleWarm2.position.set(8, 3.5, 8);
            scene.add(candleWarm2);
        }

        function buildCathedralEnvironment() {
            // Cathedral stone ground
            const groundGeo = new THREE.PlaneGeometry(80, 80);
            const groundMat = new THREE.MeshStandardMaterial({
                color: 0x090d16,
                roughness: 0.85,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.55;
            ground.receiveShadow = true;
            scene.add(ground);

            // Gothic vaulted pillars around the room
            const pillarGeo = new THREE.CylinderGeometry(0.55, 0.75, 24, 16);
            const pillarMat = new THREE.MeshStandardMaterial({
                color: 0x111827,
                roughness: 0.9,
                metalness: 0.1
            });

            const pillarPositions = [
                [-14, -14], [14, -14], [-14, 14], [14, 14],
                [-14, 0], [14, 0], [0, -18], [0, 18]
            ];

            pillarPositions.forEach(([x, z]) => {
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(x, 10, z);
                pillar.receiveShadow = true;
                scene.add(pillar);

                // Pillar pedestal
                const base = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.2, 2.2), pillarMat);
                base.position.set(x, 0, z);
                base.receiveShadow = true;
                scene.add(base);
            });

            // Ambient floating magical dust particles
            const particleCount = 180;
            const pGeo = new THREE.BufferGeometry();
            const pCoords = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount * 3; i += 3) {
                pCoords[i] = (Math.random() - 0.5) * 35;
                pCoords[i + 1] = Math.random() * 16 + 0.5;
                pCoords[i + 2] = (Math.random() - 0.5) * 35;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pCoords, 3));
            const pMat = new THREE.PointsMaterial({
                color: 0x93c5fd,
                size: 0.12,
                transparent: true,
                opacity: 0.45,
                blending: THREE.AdditiveBlending
            });
            const dust = new THREE.Points(pGeo, pMat);
            scene.add(dust);

            // Animate dust slowly
            particleSystems.push(() => {
                const positions = dust.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] -= 0.008;
                    if (positions[i] < 0.2) positions[i] = 16;
                }
                dust.geometry.attributes.position.needsUpdate = true;
            });
        }
    </script>

    <script>
        function initMaterials() {
            // White Marble Piece Material
            marbleMat = new THREE.MeshStandardMaterial({
                color: 0xf1f5f9,
                roughness: 0.22,
                metalness: 0.12
            });

            // Black Obsidian Piece Material
            obsidianMat = new THREE.MeshStandardMaterial({
                color: 0x0b0f17,
                roughness: 0.18,
                metalness: 0.85
            });

            // Board Checker Squares
            tileLightMat = new THREE.MeshStandardMaterial({
                color: 0xe2e8f0,
                roughness: 0.35,
                metalness: 0.05
            });
            tileDarkMat = new THREE.MeshStandardMaterial({
                color: 0x334155,
                roughness: 0.45,
                metalness: 0.15
            });

            // Arcane indicators
            highlightMoveMat = new THREE.MeshBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.65
            });

            highlightCaptureMat = new THREE.MeshBasicMaterial({
                color: 0xf43f5e,
                transparent: true,
                opacity: 0.75
            });
        }

        function getSquareCoord(fileIdx, rankIdx) {
            return {
                x: fileIdx * SQUARE_SIZE - BOARD_OFFSET,
                z: - (rankIdx * SQUARE_SIZE - BOARD_OFFSET)
            };
        }

        function squareToPos(sq) {
            const file = sq.charCodeAt(0) - 97; // a-h -> 0-7
            const rank = parseInt(sq[1], 10) - 1; // 1-8 -> 0-7
            return getSquareCoord(file, rank);
        }

        function buildChessBoard() {
            // Outer stone dais
            const daisGeo = new THREE.BoxGeometry(8 * SQUARE_SIZE + 1.2, 0.7, 8 * SQUARE_SIZE + 1.2);
            const daisMat = new THREE.MeshStandardMaterial({
                color: 0x0f172a,
                roughness: 0.7,
                metalness: 0.2
            });
            const dais = new THREE.Mesh(daisGeo, daisMat);
            dais.position.y = -0.35;
            dais.receiveShadow = true;
            scene.add(dais);

            // Gold trimmed border rim
            const borderGeo = new THREE.BoxGeometry(8 * SQUARE_SIZE + 0.3, 0.1, 8 * SQUARE_SIZE + 0.3);
            const borderMat = new THREE.MeshStandardMaterial({
                color: 0xb45309,
                roughness: 0.3,
                metalness: 0.8
            });
            const border = new THREE.Mesh(borderGeo, borderMat);
            border.position.y = 0.01;
            scene.add(border);

            const tileGeo = new THREE.BoxGeometry(SQUARE_SIZE * 0.97, 0.2, SQUARE_SIZE * 0.97);

            for (let f = 0; f < 8; f++) {
                for (let r = 0; r < 8; r++) {
                    const isDark = (f + r) % 2 === 0; // standard chessboard parity
                    const mat = isDark ? tileDarkMat : tileLightMat;
                    const tile = new THREE.Mesh(tileGeo, mat);
                    const pos = getSquareCoord(f, r);
                    tile.position.set(pos.x, 0.05, pos.z);
                    tile.receiveShadow = true;

                    const sqName = String.fromCharCode(97 + f) + (r + 1);
                    tile.userData = { square: sqName, isTile: true };
                    scene.add(tile);
                    boardTiles.push(tile);
                }
            }
        }
    </script>

    <script>
        function createPieceMesh(type, color) {
            const group = new THREE.Group();
            const mat = color === 'w' ? marbleMat : obsidianMat;

            // Shared Gothic Pedestal
            const baseMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 0.28, 16), mat);
            baseMesh.castShadow = true;
            baseMesh.receiveShadow = true;
            baseMesh.position.y = 0.14;
            group.add(baseMesh);

            const midMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.52, 0.2, 16), mat);
            midMesh.castShadow = true;
            midMesh.position.y = 0.32;
            group.add(midMesh);

            switch (type) {
                case 'p': { // Pawn: Arcane obelisk orb
                    const body = new THREE.Mesh(new THREE.ConeGeometry(0.36, 0.9, 16), mat);
                    body.position.y = 0.82;
                    body.castShadow = true;
                    const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), mat);
                    head.position.y = 1.35;
                    head.castShadow = true;
                    group.add(body, head);
                    break;
                }
                case 'r': { // Rook: Gothic fortress tower with battlements
                    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.46, 1.2, 16), mat);
                    col.position.y = 0.92;
                    col.castShadow = true;
                    const parapet = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.44, 0.4, 16), mat);
                    parapet.position.y = 1.6;
                    parapet.castShadow = true;
                    group.add(col, parapet);
                    break;
                }
                case 'n': { // Knight: Stylized warhorse spire
                    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.44, 0.9, 16), mat);
                    torso.position.y = 0.85;
                    torso.castShadow = true;
                    const head = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.55, 0.68), mat);
                    head.position.set(0, 1.4, 0.1);
                    head.rotation.x = -0.3;
                    head.castShadow = true;
                    group.add(torso, head);
                    break;
                }
                case 'b': { // Bishop: Wizard Mitre Spire with crystal crest
                    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.45, 1.3, 16), mat);
                    pillar.position.y = 1.0;
                    pillar.castShadow = true;
                    const mitre = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.7, 16), mat);
                    mitre.position.y = 1.85;
                    mitre.castShadow = true;
                    const finial = new THREE.Mesh(new THREE.OctahedronGeometry(0.16), mat);
                    finial.position.y = 2.25;
                    group.add(pillar, mitre, finial);
                    break;
                }
                case 'q': { // Queen: Fluted regal coronet
                    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.5, 1.6, 16), mat);
                    stem.position.y = 1.15;
                    stem.castShadow = true;
                    const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.32, 0.45, 12), mat);
                    crown.position.y = 2.05;
                    crown.castShadow = true;
                    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), mat);
                    orb.position.y = 2.4;
                    group.add(stem, crown, orb);
                    break;
                }
                case 'k': { // King: Majestic gothic monarch crown
                    const royalStem = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.52, 1.8, 16), mat);
                    royalStem.position.y = 1.25;
                    royalStem.castShadow = true;
                    const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.45, 0.12), mat);
                    crossV.position.y = 2.45;
                    const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.12, 0.12), mat);
                    crossH.position.y = 2.45;
                    crossV.castShadow = true;
                    crossH.castShadow = true;
                    group.add(royalStem, crossV, crossH);
                    break;
                }
            }

            // Align pieces to face their rival opponent
            if (color === 'b') {
                group.rotation.y = Math.PI;
            }

            return group;
        }

        function spawnInitialPieces() {
            clearAllPieces();
            const board = chess.board();

            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const piece = board[7 - r][f];
                    if (piece) {
                        const sq = String.fromCharCode(97 + f) + (r + 1);
                        addPieceToScene(sq, piece.type, piece.color);
                    }
                }
            }
        }

        function addPieceToScene(sq, type, color) {
            const mesh = createPieceMesh(type, color);
            const pos = squareToPos(sq);
            mesh.position.set(pos.x, 0.1, pos.z);
            mesh.userData = {
                square: sq,
                type: type,
                color: color,
                baseY: 0.1,
                idleSeed: Math.random() * Math.PI * 2
            };
            scene.add(mesh);
            piecesMap.set(sq, mesh);
        }

        function clearAllPieces() {
            piecesMap.forEach(mesh => scene.remove(mesh));
            piecesMap.clear();
        }
    </script>

    <script>
        function createShatterExplosion(position, pieceColor) {
            soundFX.playShatter();
            const shardCount = 22;
            const shardGroup = new THREE.Group();
            const colorHex = pieceColor === 'w' ? 0xe2e8f0 : 0x0f172a;
            const shardMat = new THREE.MeshStandardMaterial({
                color: colorHex,
                roughness: 0.2,
                metalness: pieceColor === 'w' ? 0.2 : 0.85
            });

            const shards = [];

            for (let i = 0; i < shardCount; i++) {
                const geo = Math.random() > 0.5 
                    ? new THREE.TetrahedronGeometry(Math.random() * 0.25 + 0.12)
                    : new THREE.BoxGeometry(0.2, 0.2, 0.2);
                const mesh = new THREE.Mesh(geo, shardMat);
                mesh.position.copy(position);
                mesh.position.y += Math.random() * 0.6;
                shardGroup.add(mesh);

                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3.5 + 1.5;
                shards.push({
                    mesh,
                    velX: Math.cos(angle) * speed,
                    velY: Math.random() * 4.5 + 2.5,
                    velZ: Math.sin(angle) * speed,
                    rotX: (Math.random() - 0.5) * 12,
                    rotY: (Math.random() - 0.5) * 12
                });
            }

            scene.add(shardGroup);

            // Shard animation physics loop
            let elapsed = 0;
            const animateShards = () => {
                elapsed += 0.016;
                let active = false;

                shards.forEach(s => {
                    s.velY -= 9.8 * 0.016; // gravity
                    s.mesh.position.x += s.velX * 0.016;
                    s.mesh.position.y += s.velY * 0.016;
                    s.mesh.position.z += s.velZ * 0.016;

                    s.mesh.rotation.x += s.rotX * 0.016;
                    s.mesh.rotation.y += s.rotY * 0.016;

                    // Bounce off ground
                    if (s.mesh.position.y < 0.1) {
                        s.mesh.position.y = 0.1;
                        s.velY *= -0.3;
                        s.velX *= 0.6;
                        s.velZ *= 0.6;
                    }
                    if (elapsed < 1.4) active = true;
                });

                if (elapsed >= 1.0) {
                    shardGroup.scale.multiplyScalar(0.92); // Shrink and disintegrate
                }

                if (!active || elapsed >= 1.5) {
                    scene.remove(shardGroup);
                    const idx = particleSystems.indexOf(animateShards);
                    if (idx !== -1) particleSystems.splice(idx, 1);
                }
            };

            particleSystems.push(animateShards);
        }

        function createMagicAttackBeam(fromPos, toPos, callback) {
            soundFX.playCastSpell();
            const beamPoints = [
                new THREE.Vector3(fromPos.x, fromPos.y + 0.8, fromPos.z),
                new THREE.Vector3((fromPos.x + toPos.x) / 2, 2.8, (fromPos.z + toPos.z) / 2),
                new THREE.Vector3(toPos.x, toPos.y + 0.5, toPos.z)
            ];
            const curve = new THREE.CatmullRomCurve3(beamPoints);
            const tubeGeo = new THREE.TubeGeometry(curve, 20, 0.09, 8, false);
            const tubeMat = new THREE.MeshBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.95
            });
            const beamMesh = new THREE.Mesh(tubeGeo, tubeMat);
            scene.add(beamMesh);

            gsap.to(beamMesh.scale, {
                x: 1.5,
                y: 1.5,
                duration: 0.18,
                yoyo: true,
                repeat: 1,
                onComplete: () => {
                    scene.remove(beamMesh);
                    if (callback) callback();
                }
            });
        }
    </script>

    <script>
        function executeAnimatedMove(fromSquare, toSquare, isAIMove = false, onFinished = null) {
            const pieceMesh = piecesMap.get(fromSquare);
            if (!pieceMesh) return;

            const capturedMesh = piecesMap.get(toSquare);
            const targetPos = squareToPos(toSquare);
            isAnimating = true;

            const makeMoveInEngine = () => {
                // Determine engine move
                const moveResult = chess.move({
                    from: fromSquare,
                    to: toSquare,
                    promotion: 'q' // Auto-promote to Queen in Wizard's Chess
                });

                if (!moveResult) {
                    isAnimating = false;
                    return;
                }

                soundFX.playMove();

                // Update internal mapping
                piecesMap.delete(fromSquare);
                pieceMesh.userData.square = toSquare;
                piecesMap.set(toSquare, pieceMesh);

                // Handle Castling Rook movements
                if (moveResult.flags.includes('k') || moveResult.flags.includes('q')) {
                    if (toSquare === 'g1') moveRookInstantly('h1', 'f1');
                    else if (toSquare === 'c1') moveRookInstantly('a1', 'd1');
                    else if (toSquare === 'g8') moveRookInstantly('h8', 'f8');
                    else if (toSquare === 'c8') moveRookInstantly('a8', 'd8');
                }

                // Handle Promotion Model swap
                if (moveResult.flags.includes('p')) {
                    scene.remove(pieceMesh);
                    const newQueen = createPieceMesh('q', moveResult.color);
                    newQueen.position.set(targetPos.x, 0.1, targetPos.z);
                    newQueen.userData = {
                        square: toSquare,
                        type: 'q',
                        color: moveResult.color,
                        baseY: 0.1,
                        idleSeed: Math.random() * Math.PI * 2
                    };
                    scene.add(newQueen);
                    piecesMap.set(toSquare, newQueen);
                }

                updateUIChronicle(moveResult);
                checkGameState();

                isAnimating = false;
                if (onFinished) onFinished();

                // AI Turn Trigger
                if (chess.turn() === 'b' && !chess.game_over()) {
                    triggerAIMove();
                }
            };

            // If it's a capture, execute magic attack sequence!
            if (capturedMesh) {
                const capturedPos = capturedMesh.position.clone();

                createMagicAttackBeam(pieceMesh.position, capturedPos, () => {
                    createShatterExplosion(capturedPos, capturedMesh.userData.color);
                    scene.remove(capturedMesh);
                    piecesMap.delete(toSquare);

                    // Physical move arc for the victor
                    gsap.timeline()
                        .to(pieceMesh.position, { y: 1.4, duration: 0.25, ease: "power2.out" })
                        .to(pieceMesh.position, { x: targetPos.x, z: targetPos.z, duration: 0.35, ease: "power2.inOut" })
                        .to(pieceMesh.position, { y: 0.1, duration: 0.2, ease: "bounce.out", onComplete: makeMoveInEngine });
                });
            } else {
                // Peaceful glide across the board
                gsap.timeline()
                    .to(pieceMesh.position, { y: 1.1, duration: 0.22, ease: "power1.out" })
                    .to(pieceMesh.position, { x: targetPos.x, z: targetPos.z, duration: 0.38, ease: "power2.inOut" })
                    .to(pieceMesh.position, { y: 0.1, duration: 0.18, ease: "bounce.out", onComplete: makeMoveInEngine });
            }
        }

        function moveRookInstantly(fromSq, toSq) {
            const rook = piecesMap.get(fromSq);
            if (!rook) return;
            const targetPos = squareToPos(toSq);
            piecesMap.delete(fromSq);
            rook.userData.square = toSq;
            piecesMap.set(toSq, rook);

            gsap.to(rook.position, {
                x: targetPos.x,
                z: targetPos.z,
                duration: 0.35,
                ease: "power2.out"
            });
        }
    </script>

    <script>
        function triggerAIMove() {
            setTimeout(() => {
                if (chess.game_over()) return;

                const legalMoves = chess.moves({ verbose: true });
                if (legalMoves.length === 0) return;

                let chosenMove = null;

                if (aiDifficulty === 'novice') {
                    // Random legal move
                    chosenMove = legalMoves[Math.floor(Math.random() * legalMoves.length)];
                } else if (aiDifficulty === 'apprentice') {
                    // Prioritize captures and checks
                    const captureMoves = legalMoves.filter(m => m.captured);
                    if (captureMoves.length > 0) {
                        chosenMove = captureMoves[Math.floor(Math.random() * captureMoves.length)];
                    } else {
                        chosenMove = legalMoves[Math.floor(Math.random() * legalMoves.length)];
                    }
                } else {
                    // Archmage AI: Minimax heuristic evaluation
                    let bestScore = -Infinity;
                    legalMoves.forEach(move => {
                        chess.move(move);
                        const score = -evaluateBoard(chess);
                        chess.undo();
                        if (score > bestScore) {
                            bestScore = score;
                            chosenMove = move;
                        }
                    });
                    if (!chosenMove) {
                        chosenMove = legalMoves[Math.floor(Math.random() * legalMoves.length)];
                    }
                }

                if (chosenMove) {
                    executeAnimatedMove(chosenMove.from, chosenMove.to, true);
                }
            }, 600);
        }

        // Heuristic material and positional evaluation for Archmage
        function evaluateBoard(game) {
            let total = 0;
            const board = game.board();

            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const p = board[r][f];
                    if (p) {
                        const val = pieceValues[p.type] * 10;
                        // Center board control bonus
                        const centerBonus = (3.5 - Math.abs(3.5 - f)) + (3.5 - Math.abs(3.5 - r));
                        const score = val + centerBonus;
                        total += (p.color === 'b') ? score : -score;
                    }
                }
            }
            return total;
        }
    </script>

    <script>
        function clearMoveHighlights() {
            activeIndicators.forEach(mesh => scene.remove(mesh));
            activeIndicators.length = 0;
        }

        function showMoveHighlights(fromSq) {
            clearMoveHighlights();
            const moves = chess.moves({ square: fromSq, verbose: true });
            validMoveSquares = moves.map(m => m.to);

            moves.forEach(m => {
                const targetPos = squareToPos(m.to);
                const isCapture = !!m.captured;

                const ringGeo = new THREE.RingGeometry(0.3, 0.58, 24);
                const mat = isCapture ? highlightCaptureMat : highlightMoveMat;
                const ring = new THREE.Mesh(ringGeo, mat);
                ring.rotation.x = -Math.PI / 2;
                ring.position.set(targetPos.x, 0.16, targetPos.z);
                scene.add(ring);
                activeIndicators.push(ring);
            });
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onPointerDown(event) {
            // Prevent interaction while moves are animating or when clicking UI elements
            if (isAnimating || chess.game_over() || chess.turn() !== 'w') return;
            if (event.target.closest('header, aside, #game-modal')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Intersect with tiles and pieces
            const checkObjects = [...boardTiles];
            piecesMap.forEach(mesh => {
                mesh.traverse(child => {
                    if (child.isMesh) checkObjects.push(child);
                });
            });

            const intersects = raycaster.intersectObjects(checkObjects, true);

            if (intersects.length > 0) {
                let hitSquare = null;

                for (let hit of intersects) {
                    let obj = hit.object;
                    // Check if clicked tile
                    if (obj.userData && obj.userData.isTile) {
                        hitSquare = obj.userData.square;
                        break;
                    }
                    // Check if clicked piece
                    let parent = obj;
                    while (parent && !parent.userData.square) {
                        parent = parent.parent;
                    }
                    if (parent && parent.userData.square) {
                        hitSquare = parent.userData.square;
                        break;
                    }
                }

                if (!hitSquare) return;

                // Move execution check
                if (selectedSquare && validMoveSquares.includes(hitSquare)) {
                    const from = selectedSquare;
                    selectedSquare = null;
                    clearMoveHighlights();
                    executeAnimatedMove(from, hitSquare);
                    return;
                }

                // Piece Selection Check (Must be White's pieces)
                const pieceOnSquare = chess.get(hitSquare);
                if (pieceOnSquare && pieceOnSquare.color === 'w') {
                    selectedSquare = hitSquare;
                    soundFX.playHover();
                    showMoveHighlights(hitSquare);
                } else {
                    selectedSquare = null;
                    clearMoveHighlights();
                }
            }
        }
    </script>

    <script>
        function updateUIChronicle(move) {
            const statusEl = document.getElementById('match-status');
            const historyEl = document.getElementById('move-history');

            // Format san string
            const turnNumber = Math.ceil(chess.history().length / 2);
            const colorName = move.color === 'w' ? 'Marble' : 'Obsidian';
            const logEntry = document.createElement('div');
            logEntry.className = "flex items-center justify-between text-[11px] py-0.5 border-b border-white/5";
            logEntry.innerHTML = `
                <span class="text-slate-400">${turnNumber}. ${colorName}</span>
                <span class="font-mono font-bold ${move.color === 'w' ? 'text-sky-300' : 'text-amber-400'}">${move.san}</span>
            `;
            historyEl.appendChild(logEntry);
            historyEl.scrollTop = historyEl.scrollHeight;

            // Update captured rack
            updateCapturedRacks();

            // Next player status
            const nextTurn = chess.turn() === 'w' ? "White Marble's Turn" : "Obsidian (AI) Conjuring...";
            statusEl.textContent = nextTurn;
        }

        function updateCapturedRacks() {
            const board = chess.board();
            const currentCounts = { w: { p:0,n:0,b:0,r:0,q:0 }, b: { p:0,n:0,b:0,r:0,q:0 } };

            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const p = board[r][f];
                    if (p && p.type !== 'k') {
                        currentCounts[p.color][p.type]++;
                    }
                }
            }

            const initialCounts = { p: 8, n: 2, b: 2, r: 2, q: 1 };
            const capturedWhite = [];
            const capturedBlack = [];

            let scoreWhite = 0;
            let scoreBlack = 0;

            for (let type in initialCounts) {
                // Lost white pieces
                const lostW = initialCounts[type] - currentCounts.w[type];
                for (let i = 0; i < lostW; i++) {
                    capturedWhite.push(pieceSymbols[type]);
                    scoreBlack += pieceValues[type];
                }
                // Lost black pieces
                const lostB = initialCounts[type] - currentCounts.b[type];
                for (let i = 0; i < lostB; i++) {
                    capturedBlack.push(pieceSymbols[type]);
                    scoreWhite += pieceValues[type];
                }
            }

            document.getElementById('captured-black').textContent = capturedBlack.join(' ') || 'None';
            document.getElementById('captured-white').textContent = capturedWhite.join(' ') || 'None';
            document.getElementById('score-w').textContent = `+${Math.max(0, scoreWhite - scoreBlack)}`;
            document.getElementById('score-b').textContent = `+${Math.max(0, scoreBlack - scoreWhite)}`;
        }

        function checkGameState() {
            const checkBadge = document.getElementById('check-badge');
            if (chess.in_check() && !chess.game_over()) {
                checkBadge.classList.remove('hidden');
                soundFX.playCheck();
            } else {
                checkBadge.classList.add('hidden');
            }

            if (chess.game_over()) {
                let title = "Game Concluded";
                let desc = "The duel has concluded in a stalemate.";

                if (chess.in_checkmate()) {
                    const winner = chess.turn() === 'w' ? 'Black Obsidian' : 'White Marble';
                    title = "Checkmate!";
                    desc = `${winner} has shattered their opponent's royal defense.`;
                } else if (chess.in_draw()) {
                    title = "Arcane Draw";
                    desc = "Neither wizard can claim dominance over the cathedral.";
                }

                showGameOverModal(title, desc);
            }
        }

        function showGameOverModal(title, desc) {
            const modal = document.getElementById('game-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.remove('scale-95');
        }

        function hideGameOverModal() {
            const modal = document.getElementById('game-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.add('scale-95');
        }

        function resetGame() {
            chess.reset();
            selectedSquare = null;
            clearMoveHighlights();
            spawnInitialPieces();
            hideGameOverModal();

            document.getElementById('match-status').textContent = "White Marble's Turn";
            document.getElementById('check-badge').classList.add('hidden');
            document.getElementById('move-history').innerHTML = '<div class="text-slate-500 italic">Game recommenced.</div>';
            document.getElementById('captured-black').textContent = '';
            document.getElementById('captured-white').textContent = '';
            document.getElementById('score-w').textContent = '+0';
            document.getElementById('score-b').textContent = '+0';
        }
    </script>

    <script>
        function setupUIControls() {
            // Camera Presets
            const cameraPresets = [
                { pos: [0, 14, 15], target: [0, 0, 0] },     // Perspective White view
                { pos: [0, 20, 0.1], target: [0, 0, 0] },    // Orthogonal Overhead
                { pos: [0, 14, -15], target: [0, 0, 0] },    // Perspective Black view
                { pos: [14, 10, 12], target: [0, 0, 0] }     // Dramatic Gothic Angle
            ];

            document.getElementById('btn-camera').addEventListener('click', () => {
                cameraModeIndex = (cameraModeIndex + 1) % cameraPresets.length;
                const preset = cameraPresets[cameraModeIndex];
                gsap.to(camera.position, {
                    x: preset.pos[0],
                    y: preset.pos[1],
                    z: preset.pos[2],
                    duration: 1.2,
                    ease: "power2.inOut"
                });
                gsap.to(controls.target, {
                    x: preset.target[0],
                    y: preset.target[1],
                    z: preset.target[2],
                    duration: 1.2,
                    ease: "power2.inOut"
                });
            });

            // AI Difficulty Toggle
            const diffs = ['novice', 'apprentice', 'archmage'];
            const diffLabels = {
                novice: 'AI: Novice',
                apprentice: 'AI: Apprentice',
                archmage: 'AI: Archmage'
            };
            document.getElementById('btn-difficulty').addEventListener('click', () => {
                const currentIdx = diffs.indexOf(aiDifficulty);
                aiDifficulty = diffs[(currentIdx + 1) % diffs.length];
                document.getElementById('diff-label').textContent = diffLabels[aiDifficulty];
            });

            // Sound Toggle
            const soundBtn = document.getElementById('btn-sound');
            const soundIcon = document.getElementById('sound-icon');
            soundBtn.addEventListener('click', () => {
                const on = soundFX.toggle();
                soundIcon.className = on 
                    ? "fa-solid fa-volume-high text-amber-400 text-sm" 
                    : "fa-solid fa-volume-xmark text-slate-500 text-sm";
            });

            // Reset Buttons
            document.getElementById('btn-reset').addEventListener('click', resetGame);
            document.getElementById('modal-btn-restart').addEventListener('click', resetGame);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>

    <script>
        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            // Run active particle animations
            for (let i = particleSystems.length - 1; i >= 0; i--) {
                particleSystems[i]();
            }

            // Idle mystical floating hover for undisturbed pieces
            const time = performance.now() * 0.002;
            piecesMap.forEach(piece => {
                if (!piece.userData.isAnimating && piece.userData.idleSeed !== undefined) {
                    piece.position.y = piece.userData.baseY + Math.sin(time + piece.userData.idleSeed) * 0.04;
                }
            });

            renderer.render(scene, camera);
        }

        window.onload = () => {
            initScene();
            setupUIControls();
            animate();
        };
    </script>
